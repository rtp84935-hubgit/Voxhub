<style>
    .ab-wrap {
        position: fixed;
        top: 16px;
        right: 24px;
        z-index: 1000;
        font-family: 'Manrope', sans-serif;
    }
    .ab-wrap [hidden] { display: none !important; }

    .ab-btn {
        position: relative;
        width: 42px;
        height: 42px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #121925;
        border: 1px solid #273244;
        border-radius: 12px;
        color: #c4b5fd;
        cursor: pointer;
        transition: 0.2s;
    }
    .ab-btn:hover { background: #1a2333; border-color: #354256; }
    .ab-btn:focus-visible { outline: 2px solid #c4b5fd; outline-offset: 3px; }
    .ab-btn svg { width: 18px; height: 18px; }

    .ab-badge {
        position: absolute;
        top: -6px;
        right: -6px;
        min-width: 19px;
        height: 19px;
        padding: 0 5px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fb7185;
        color: #0b111c;
        border-radius: 20px;
        font-size: 10px;
        font-weight: 800;
    }

    .ab-panel {
        position: absolute;
        top: 52px;
        right: 0;
        width: 340px;
        max-width: calc(100vw - 32px);
        background: #121925;
        border: 1px solid #273244;
        border-radius: 16px;
        box-shadow: 0 18px 50px #00000080;
        overflow: hidden;
    }

    .ab-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px;
        border-bottom: 1px solid #273244;
        color: #e5e7eb;
        font-size: 13px;
    }
    .ab-head strong { font-weight: 800; }
    .ab-head button {
        background: none;
        border: none;
        color: #a78bfa;
        font-family: inherit;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
    }
    .ab-head button:hover { color: #c4b5fd; }

    .ab-list { max-height: 380px; overflow-y: auto; }

    .ab-item {
        display: flex;
        gap: 11px;
        padding: 13px 16px;
        border-bottom: 1px solid #1f2937;
    }
    .ab-item:last-child { border-bottom: none; }
    .ab-item.unread { background: #171f2e; }

    .ab-dot {
        width: 9px;
        height: 9px;
        margin-top: 5px;
        flex-shrink: 0;
        border-radius: 50%;
        background: #8b5cf6;
    }
    .ab-item.report .ab-dot { background: #fcd34d; }
    .ab-item.security .ab-dot { background: #fda4af; }

    .ab-msg { color: #e5e7eb; font-size: 12px; line-height: 1.6; word-break: break-word; }
    .ab-time { margin-top: 3px; color: #718096; font-size: 10px; }
    .ab-empty { padding: 30px 16px; text-align: center; color: #718096; font-size: 12px; }
</style>

<div class="ab-wrap" id="adminBell">
    {% csrf_token %}

    <button type="button" class="ab-btn" id="abBtn" aria-label="Notifications" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <span class="ab-badge" id="abBadge" hidden>0</span>
    </button>

    <div class="ab-panel" id="abPanel" hidden>
        <div class="ab-head">
            <strong>Notifications</strong>
            <button type="button" id="abRead">Mark all as read</button>
        </div>
        <div class="ab-list" id="abList">
            <div class="ab-empty">Loading…</div>
        </div>
    </div>
</div>

<script>
(function () {
    var URL_LIST = "{% url 'admin_notifications' %}";
    var URL_READ = "{% url 'admin_notifications_read' %}";

    var root  = document.getElementById('adminBell');
    var btn   = document.getElementById('abBtn');
    var badge = document.getElementById('abBadge');
    var panel = document.getElementById('abPanel');
    var list  = document.getElementById('abList');
    var readBtn = document.getElementById('abRead');
    var token = root.querySelector('input[name=csrfmiddlewaretoken]');

    function render(data) {
        if (data.unread > 0) {
            badge.textContent = data.unread > 99 ? '99+' : data.unread;
            badge.hidden = false;
        } else {
            badge.hidden = true;
        }

        list.textContent = '';

        if (!data.items.length) {
            var empty = document.createElement('div');
            empty.className = 'ab-empty';
            empty.textContent = 'No notifications';
            list.appendChild(empty);
            return;
        }

        data.items.forEach(function (n) {
            var row = document.createElement('div');
            row.className = 'ab-item ' + n.kind + (n.is_read ? '' : ' unread');

            var dot = document.createElement('span');
            dot.className = 'ab-dot';

            var body = document.createElement('div');
            var msg = document.createElement('div');
            msg.className = 'ab-msg';
            msg.textContent = n.message;           /* textContent: safe against HTML in usernames */
            var time = document.createElement('div');
            time.className = 'ab-time';
            time.textContent = n.time;

            body.appendChild(msg);
            body.appendChild(time);
            row.appendChild(dot);
            row.appendChild(body);
            list.appendChild(row);
        });
    }

    function load() {
        fetch(URL_LIST, {
            credentials: 'same-origin',
            headers: { 'X-Requested-With': 'XMLHttpRequest' }
        })
        .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
        .then(render)
        .catch(function () {});
    }

    btn.addEventListener('click', function () {
        var open = panel.hidden;
        panel.hidden = !open;
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        if (open) load();
    });

    readBtn.addEventListener('click', function () {
        fetch(URL_READ, {
            method: 'POST',
            credentials: 'same-origin',
            headers: {
                'X-CSRFToken': token ? token.value : '',
                'X-Requested-With': 'XMLHttpRequest'
            }
        }).then(load).catch(function () {});
    });

    document.addEventListener('click', function (e) {
        if (!root.contains(e.target) && !panel.hidden) {
            panel.hidden = true;
            btn.setAttribute('aria-expanded', 'false');
        }
    });

    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !panel.hidden) {
            panel.hidden = true;
            btn.setAttribute('aria-expanded', 'false');
            btn.focus();
        }
    });

    /* lets the settings page refresh the bell right after a toggle changes */
    window.refreshAdminBell = load;

    load();
    setInterval(function () { if (!document.hidden) load(); }, 15000);
})();
</script>
