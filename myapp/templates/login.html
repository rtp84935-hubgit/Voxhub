<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Voice Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg:        #0b0e1a;
            --surface:   #131829;
            --surface-2: #1a2036;
            --line:      #272e49;
            --text:      #e8eaf6;
            --muted:     #8e96b8;
            --accent:    #7c6cff;
            --accent-2:  #22d3ee;
            --ok:        #34d399;
            --bad:       #f87171;
        }

        * {
            box-sizing: border-box;
        }

        html {
            color-scheme: dark;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 14px;
            background:
                radial-gradient(900px 500px at 10% -10%, rgba(124, 108, 255, 0.18), transparent 60%),
                radial-gradient(800px 500px at 100% 0%, rgba(34, 211, 238, 0.10), transparent 60%),
                var(--bg);
            background-attachment: fixed;
            font-family: "Manrope", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
            color: var(--text);
            line-height: 1.5;
        }

        .login-box {
            width: 420px;
            max-width: 100%;
            padding: 38px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 22px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
        }

        h1 {
            text-align: center;
            margin: 0 0 30px;
            font-size: 1.9rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(90deg, #ffffff 0%, #b8b0ff 50%, #7ee7f7 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #c5cae6;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 13px 14px;
            margin-bottom: 20px;
            font: inherit;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--surface-2);
            color: var(--text);
            outline: none;
            transition: border-color .15s ease, box-shadow .15s ease;
        }

        input::placeholder {
            color: #5d6590;
        }

        input:hover {
            border-color: #38416a;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(124, 108, 255, 0.28);
        }

        .voice-section {
            margin-top: 10px;
            padding: 22px 20px;
            border: 1px solid var(--line);
            background: var(--surface-2);
            border-radius: 14px;
            text-align: center;
        }

        .voice-section h3 {
            margin: 0 0 6px;
            font-size: 1.05rem;
            font-weight: 700;
        }

        .voice-section p {
            margin: 0 0 8px;
            font-size: 14px;
            color: var(--muted);
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            border: 1px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            font: inherit;
            font-size: 15px;
            font-weight: 700;
            transition: transform .12s ease, filter .15s ease, box-shadow .15s ease;
        }

        button:hover:not(:disabled) {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:focus-visible {
            outline: 2px solid var(--accent-2);
            outline-offset: 2px;
        }

        #startBtn {
            background: linear-gradient(135deg, #22d3ee, #34d399);
            color: #04130f;
            box-shadow: 0 6px 18px rgba(34, 211, 238, 0.22);
        }

        #stopBtn {
            background: rgba(248, 113, 113, 0.16);
            border-color: rgba(248, 113, 113, 0.55);
            color: #fecaca;
        }

        #loginBtn {
            background: linear-gradient(135deg, var(--accent), #4f8dff 60%, var(--accent-2));
            color: #fff;
            margin-top: 26px;
            padding: 15px;
            font-size: 16px;
            box-shadow: 0 10px 30px rgba(94, 120, 255, 0.35);
        }

        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            box-shadow: none;
        }

        #status {
            margin-top: 16px;
            font-size: 14px;
            font-weight: 600;
            color: var(--ok);
            min-height: 20px;
        }

        .error {
            background: rgba(248, 113, 113, 0.12);
            border: 1px solid rgba(248, 113, 113, 0.4);
            color: #fca5a5;
            padding: 11px 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
        }

        .success {
            background: rgba(52, 211, 153, 0.12);
            border: 1px solid rgba(52, 211, 153, 0.4);
            color: #6ee7b7;
            padding: 11px 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
        }

        .signup-section {
            margin-top: 26px;
            padding-top: 22px;
            border-top: 1px solid var(--line);
            text-align: center;
        }

        .signup-section p {
            margin: 0 0 4px;
            font-size: 14px;
            color: var(--muted);
        }

        .signup-link {
            display: block;
            margin-top: 12px;
            padding: 13px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--surface-2);
            color: var(--text);
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            transition: border-color .15s ease, transform .12s ease, background .15s ease;
        }

        .signup-link:hover {
            border-color: var(--accent);
            background: rgba(124, 108, 255, 0.12);
            transform: translateY(-1px);
        }

        .signup-link:focus-visible {
            outline: 2px solid var(--accent-2);
            outline-offset: 2px;
        }

        @media (max-width: 480px) {
            .login-box { padding: 26px 20px; border-radius: 18px; }
            h1 { font-size: 1.6rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
        .admin-login-link {
    display: block;
    margin-top: 14px;
    padding: 12px;
    text-align: center;
    color: #22d3ee;
    border: 1px solid #272e49;
    border-radius: 10px;
    background: #0b0e1a;
    font-size: 14px;
    font-weight: 700;
    text-decoration: none;
    transition: 0.2s ease;
}

.admin-login-link:hover {
    border-color: #22d3ee;
    background: rgba(34, 211, 238, 0.1);
}
    </style>
</head>

<body>

<div class="login-box">

    <h1>Voice Login</h1>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form id="loginForm"
          method="POST"
          action="{% url 'login' %}"
          enctype="multipart/form-data">

        {% csrf_token %}

        <!-- USERNAME -->

        <label for="username">
            Username
        </label>

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter username"
            required
        >


        <!-- PASSWORD -->

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
            required
        >


        <!-- VOICE -->

        <div class="voice-section">

            <h3>Voice Verification</h3>

            <p>
                Click start and speak for at least
                2 seconds.
            </p>

            <button
                type="button"
                id="startBtn">
                🎙 Start Recording
            </button>

            <button
                type="button"
                id="stopBtn"
                disabled>
                ⏹ Stop Recording
            </button>

            <div id="status">
                Voice not recorded
            </div>

        </div>


        <!-- Hidden voice file -->

        <input
            type="file"
            id="voiceInput"
            name="voice"
            hidden
        >


        <button
            type="submit"
            id="loginBtn">
            Login
        </button>

    </form>

    <!-- SIGN UP -->

    <div class="signup-section">
    <p>New to VoxHub?</p>
    <a class="signup-link" href="/myapp/registration/">
        Create an account
    </a>

    <a class="admin-login-link" href="/myapp/admin_login/">
        🛡️ Administration Login
    </a>
</div>

</div>


<script>

let mediaRecorder;
let audioChunks = [];
let audioBlob = null;

const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const loginBtn = document.getElementById("loginBtn");
const statusText = document.getElementById("status");
const voiceInput = document.getElementById("voiceInput");
const loginForm = document.getElementById("loginForm");


/*
    START RECORDING
*/

startBtn.addEventListener("click", async () => {

    try {

        const stream = await navigator.mediaDevices.getUserMedia({
            audio: true
        });

        audioChunks = [];

        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = (event) => {

            if (event.data.size > 0) {
                audioChunks.push(event.data);
            }

        };


        mediaRecorder.onstop = () => {

            audioBlob = new Blob(
                audioChunks,
                {
                    type: "audio/webm"
                }
            );

            /*
                Convert Blob into File
            */

            const audioFile = new File(
                [audioBlob],
                "login_voice.webm",
                {
                    type: "audio/webm"
                }
            );


            /*
                Put the file into
                the hidden file input
            */

            const dataTransfer = new DataTransfer();

            dataTransfer.items.add(audioFile);

            voiceInput.files = dataTransfer.files;


            statusText.innerText =
                "✓ Voice recorded successfully";

            statusText.style.color =
                "#19d3ae";


            /*
                Stop microphone
            */

            stream.getTracks().forEach(
                track => track.stop()
            );

        };


        mediaRecorder.start();

        startBtn.disabled = true;
        stopBtn.disabled = false;

        statusText.innerText =
            "🎙 Recording... Speak now";

        statusText.style.color =
            "#ffcc00";

    }

    catch (error) {

        console.error(error);

        statusText.innerText =
            "Microphone permission denied.";

        statusText.style.color =
            "#ff7777";

    }

});


/*
    STOP RECORDING
*/

stopBtn.addEventListener("click", () => {

    if (
        mediaRecorder &&
        mediaRecorder.state !== "inactive"
    ) {

        mediaRecorder.stop();

    }

    startBtn.disabled = false;
    stopBtn.disabled = true;

});


/*
    LOGIN VALIDATION
*/

loginForm.addEventListener("submit", (event) => {

    if (!voiceInput.files.length) {

        event.preventDefault();

        statusText.innerText =
            "Please record your voice before login.";

        statusText.style.color =
            "#ff7777";

        return;

    }

});

</script>

</body>
</html>
